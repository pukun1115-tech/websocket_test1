<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>connection test</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        canvas {
            display: block;
            background-color: rgba(0, 0, 0, 1);
        }
    </style>
</head>

<body>
    <canvas id="canvas"></canvas>
    <script>
        (() => {
            let map = [];
            const canvas = document.getElementById("canvas");
            const ctx = canvas.getContext("2d");
            const websocketProtocol = ((location.protocol === "https:") ? "wss:" : "ws:");
            const socket = new WebSocket(`${websocketProtocol}//${location.host}`);
            let players = new Map();
            let playerId = null;
            const keys = {};
            window.addEventListener("keydown", (event) => { keys[event.code] = true; });
            window.addEventListener("keyup", (event) => { keys[event.code] = false; });
            const inputState = {
                up: false,
                down: false,
                left: false,
                right: false
            };
            window.addEventListener("beforeunload", () => {
                socket.close();
            });

            socket.addEventListener("message", (event) => {
                const data = JSON.parse(event.data);
                if (data.type === "init") {
                    playerId = data.id;
                    map = data.map;
                    for (const p of data.players) {
                        players.set(p.id, { x: p.x, y: p.y });
                    }
                } else if (data.type === "playerJoined") {
                    players.set(data.player.id, { x: data.player.x, y: data.player.y });
                    console.log(data.player.id + " joined");
                } else if (data.type === "playerLeft") {
                    players.delete(data.id);
                    console.log(data.id + " left");
                } else if (data.type == "playerMove") {
                    players.clear();
                    for (const p of data.players) {
                        players.set(p.id, { x: p.x, y: p.y });
                    }
                }
            });
            socket.addEventListener("close", () => {
                console.log("Disconnected from server");
            });
            socket.addEventListener("error", (error) => {
                console.error("WebSocket error:", error);
            });
            socket.addEventListener("open", () => {
                console.log("Connected to server");
            });

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener("resize", resizeCanvas);
            resizeCanvas();
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const centerX = Math.floor(canvas.width / 2);
                const centerY = Math.floor(canvas.height / 2);
                const you = players.get(playerId);
                if (!you) {
                    return;
                }
                ctx.lineWidth = 2;
                for (let y = 0; y < map.length; y++) {
                    for (let x = 0; x < map[y].length; x++) {
                        if (map[y][x] === ".") {
                            ctx.fillStyle = "rgba(0, 0, 0, 1)";
                        } else if (map[y][x] === "#") {
                            ctx.fillStyle = "rgba(255, 255, 255, 1)";
                        } else {
                            ctx.fillStyle = "rgba(0, 120, 120, 1)";
                        }
                        ctx.fillRect(Math.floor((x - you.x) * 32) + centerX, Math.floor((y - you.y) * 32) + centerY, 32, 32);
                    }
                }
                for (const p of players.keys()) {
                    if (p === playerId) {
                        ctx.strokeStyle = "rgba(255, 0, 0, 1)";
                    } else {
                        ctx.strokeStyle = "rgba(0, 0, 255, 1)";
                    }
                    ctx.strokeRect(Math.floor((players.get(p).x - you.x) * 32) + centerX, Math.floor((players.get(p).y - you.y) * 32) + centerY, 16, 16);
                }
            }
            function move() {
                inputState.up = (keys["KeyW"] || keys["ArrowUp"]);
                inputState.down = (keys["KeyS"] || keys["ArrowDown"]);
                inputState.left = (keys["KeyA"] || keys["ArrowLeft"]);
                inputState.right = (keys["KeyD"] || keys["ArrowRight"]);
            }
            function sendMove() {
                if (socket.readyState === WebSocket.OPEN && (inputState.up || inputState.down || inputState.left || inputState.right)) {
                    socket.send(JSON.stringify({ type: "move", input: inputState }));
                }
            }
            //setInterval(sendMove, 10);
            function mainLoop() {
                draw();
                move();
                sendMove();
                requestAnimationFrame(mainLoop);
            }
            mainLoop();
        })();
    </script>
</body>

</html>
