<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>connection test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        #canvas {
            position: fixed;
            top: 0px;
            left: 0px;
            z-index: 1;
            display: block;
            background-color: rgba(0, 0, 0, 1);
        }

        .chat {
            position: fixed;
            left: 10px;
            bottom: 10px;
            z-index: 2;
            color: rgba(255, 255, 255, 1);
            font-family: sans-serif;
        }

        .chat-form {
            display: flex;
            align-items: center;
        }

        #messages, #messageInput, #sendButton {
            border: 1px solid rgba(127, 127, 127, 1);
            border-radius: 2px;
        }
        
        #messages {
            box-sizing: border-box;
            height: 150px;
            width: 250px;
            background-color: rgba(0, 0, 255, 0.2);
        }

        #messageInput {
            box-sizing: border-box;
            padding: 0px 5px;
            width: 200px;
            height: 25px;
            font-size: 15px;
        }

        #sendButton {
            box-sizing: border-box;
            width: 50px;
            height: 25px;
            font-size: 15px;
            color: rgba(0, 0, 0, 1);
            background-color: rgba(191, 191, 255, 0.8);
        }
    </style>
</head>

<body>
    <div class="chat">
        <div id="messages"></div>
        <div class="chat-form">
            <input type="text" id="messageInput" placeholder="メッセージを入力" maxlength="100">
            <button id="sendButton" type="button">送信</button>
        </div>
    </div>
    <canvas id="canvas"></canvas>
    <script>
        (() => {
            const canvas = document.getElementById("canvas");
            const ctx = canvas.getContext("2d");
            const websocketProtocol = ((location.protocol === "https:") ? "wss:" : "ws:");
            const socket = new WebSocket(`${websocketProtocol}//${location.host}`);
            let players = new Map();
            let playerId = null;
            const keys = {};
            let map = [];
            const messageInput = document.getElementById("messageInput");
            const sendButton = document.getElementById("sendButton");
            const messages = document.getElementById("messages");
            window.addEventListener("keydown", (event) => {
                keys[event.code] = true;
                if (event.key === "Enter" && !event.isComposing) {
                    if (document.activeElement === messageInput) {
                        event.preventDefault();
                        messageInput.blur();
                    } else {
                        event.preventDefault();
                        messageInput.focus();
                    }
                }
            });
            window.addEventListener("keyup", (event) => {
                keys[event.code] = false;
            });

            function addMessage(message) {
                const messageElement = document.createElement("div");
                messageElement.textContent = message;
                messages.appendChild(messageElement);
                messages.scrollTop = messages.scrollHeight;
            }
            function sendMessage() {
                const message = messageInput.value.trim();
                if (message !== "" && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({ type: "chat", message: message }));
                    messageInput.value = "";
                }
            }
            sendButton.addEventListener("click", sendMessage);
            messageInput.addEventListener("keydown", (event) => {
                if (event.key === "Enter") {
                    sendMessage();
                }
            });
            const inputState = {
                up: false,
                down: false,
                left: false,
                right: false
            };
            window.addEventListener("beforeunload", () => {
                socket.close();
            });

            socket.addEventListener("message", (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === "init") {
                        playerId = data.id;
                        map = data.map;
                        for (const p of data.players) {
                            players.set(p.id, { x: p.x, y: p.y });
                        }
                    } else if (data.type === "playerJoined") {
                        players.set(data.player.id, { x: data.player.x, y: data.player.y });
                        addMessage(data.player.id + " joined the game");
                    } else if (data.type === "playerLeft") {
                        players.delete(data.id);
                        addMessage(data.id + " left the game");
                    } else if (data.type == "playerMove") {
                        players.clear();
                        for (const p of data.players) {
                            players.set(p.id, { x: p.x, y: p.y });
                        }
                    } else if (data.type === "chat") {
                        addMessage(data.message);
                    }
                } catch (error) {
                    console.log("受信エラー");
                    console.log(error);
                }
            });
            socket.addEventListener("close", (event) => {
                addMessage("Disconnected from server");
                addMessage("Code: " + event.code);
                if (event.reason && event.reason !== "") {
                    addMessage("Reason: " + event.reason);
                }
            });
            socket.addEventListener("error", (event) => {
                console.log("WebSocketエラー: ", event);
                addMessage("WebSocket error occurred");
            });
            socket.addEventListener("open", () => {
                addMessage("Connected to server");
            });

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener("resize", () => {
                setTimeout(() => {
                    resizeCanvas();
                }, 50);
            });
            resizeCanvas();
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const centerX = Math.floor(canvas.width / 2);
                const centerY = Math.floor(canvas.height / 2);
                const you = players.get(playerId);
                if (!you) {
                    return;
                }
                ctx.lineWidth = 2;
                for (let y = 0; y < map.length; y++) {
                    for (let x = 0; x < map[y].length; x++) {
                        if (map[y][x] === ".") {
                            ctx.fillStyle = "rgba(0, 0, 0, 1)";
                        } else if (map[y][x] === "#") {
                            ctx.fillStyle = "rgba(255, 255, 255, 1)";
                        }
                        ctx.fillRect(Math.floor((x - you.x) * 32) + centerX, Math.floor((y - you.y) * 32) + centerY, 32, 32);
                    }
                }
                for (const p of players.keys()) {
                    if (p === playerId) {
                        ctx.strokeStyle = "rgba(255, 0, 0, 1)";
                    } else {
                        ctx.strokeStyle = "rgba(0, 0, 255, 1)";
                    }
                    ctx.strokeRect(Math.floor((players.get(p).x - you.x) * 32) + centerX, Math.floor((players.get(p).y - you.y) * 32) + centerY, 16, 16);
                }
            }
            function move() {
                if (document.activeElement !== messageInput) {
                    inputState.up = (keys["KeyW"] || keys["ArrowUp"]);
                    inputState.down = (keys["KeyS"] || keys["ArrowDown"]);
                    inputState.left = (keys["KeyA"] || keys["ArrowLeft"]);
                    inputState.right = (keys["KeyD"] || keys["ArrowRight"]);
                }
            }
            function sendMove() {
                if (socket.readyState === WebSocket.OPEN && (inputState.up || inputState.down || inputState.left || inputState.right)) {
                    socket.send(JSON.stringify({ type: "move", input: inputState }));
                }
            }
            //setInterval(sendMove, 10);
            function mainLoop() {
                draw();
                move();
                sendMove();
                requestAnimationFrame(mainLoop);
            }
            mainLoop();
        })();
    </script>
</body>

</html>
